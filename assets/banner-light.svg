<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="100%" role="img" aria-label="Murdle: A terminal whodunit where your AI assistant knows the answer and is insufferable about it."><defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcf7ec"/><stop offset=".6" stop-color="#f5ead5"/><stop offset="1" stop-color="#eedfc4"/></linearGradient>
<radialGradient id="lamp" cx=".84" cy="0" r=".95"><stop offset="0" stop-color="#e2bd72" stop-opacity=".40"/><stop offset="1" stop-color="#e2bd72" stop-opacity="0"/></radialGradient>
<radialGradient id="ember" cx="0" cy=".7" r=".8"><stop offset="0" stop-color="#e3b48a" stop-opacity=".40"/><stop offset="1" stop-color="#e3b48a" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".70"/><stop offset="1" stop-color="#ffffff" stop-opacity=".32"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe6d6" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity=".35"/></linearGradient>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c79a46"/><stop offset=".5" stop-color="#9a6b1f"/><stop offset="1" stop-color="#6b4513"/></linearGradient>
<linearGradient id="neo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#efe2c8"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6b1f" stop-opacity=".75"/><stop offset="1" stop-color="#9a6b1f" stop-opacity="0"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".11 .005" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .30  0 0 0 0 .15  1.0 0 0 0 -.36"/></filter>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter>
<filter id="soft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="lift" x="-20%" y="-40%" width="140%" height="190%"><feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#6b4a22" flood-opacity=".28"/><feDropShadow dx="-2" dy="-2" stdDeviation="2.5" flood-color="#ffffff" flood-opacity=".9"/></filter>
<mask id="feather"><rect x="13" y="13" width="854" height="286" rx="22" fill="#fff" filter="url(#soft)"/></mask>
<clipPath id="clip"><rect width="880" height="312" rx="22"/></clipPath>
</defs><g mask="url(#feather)"><rect width="880" height="312" fill="url(#wall)"/><rect width="880" height="312" fill="url(#ember)"/><rect width="880" height="312" fill="url(#lamp)"/><rect width="880" height="312" filter="url(#grain)" opacity=".35"/><ellipse cx="106" cy="234" rx="130" ry="90" fill="#edc39a" opacity=".5" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;34 -18;-18 12;0 0" dur="24s" repeatCount="indefinite"/></ellipse><ellipse cx="546" cy="296" rx="150" ry="80" fill="#b5d6c0" opacity=".55" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;-40 -14;22 10;0 0" dur="29s" repeatCount="indefinite"/></ellipse></g><text x="42" y="60" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#9a6b1f" letter-spacing="2.6">OFF THE MENU · FROM THE ARCHIVE</text><text x="40" y="128" font-family="'Bodoni 72','Bodoni MT',Didot,'Playfair Display',Georgia,'Times New Roman',serif" font-size="60" fill="#2c1a10">Murdle</text><text x="42" y="162" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#6b5238">A terminal whodunit where your AI assistant knows the answer and is</text><text x="42" y="184" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#6b5238">insufferable about it.</text><g filter="url(#lift)"><rect x="42" y="206" width="70" height="27" rx="13.5" fill="url(#neo)" stroke="#9a6b1f" stroke-opacity=".16"/></g><text x="77.0" y="224" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#2c1a10" text-anchor="middle">Python</text><g filter="url(#lift)"><rect x="121" y="206" width="106" height="27" rx="13.5" fill="url(#neo)" stroke="#9a6b1f" stroke-opacity=".16"/></g><text x="174.0" y="224" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#2c1a10" text-anchor="middle">ChatGPT API</text><g filter="url(#lift)"><rect x="236" y="206" width="84" height="27" rx="13.5" fill="url(#neo)" stroke="#9a6b1f" stroke-opacity=".16"/></g><text x="278.0" y="224" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#2c1a10" text-anchor="middle">Terminal</text><rect x="672" y="44" width="170" height="170" rx="26" fill="url(#glass)" stroke="#9a6b1f" stroke-opacity=".34"/><path d="M698 45.2 H816" stroke="#ffffff" stroke-opacity=".22" stroke-linecap="round"/><g transform="translate(672,44)"><g fill="none" stroke="url(#brass)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="85" cy="85" r="56" stroke-dasharray="3 6"/><circle cx="85" cy="85" r="44"/><g transform="translate(85,85) rotate(-30)"><ellipse rx="17" ry="25"/><path d="M0 -21c9 9 -9 30 0 42"/></g></g></g><rect x="42" y="268" width="796" height="1" fill="url(#fade)"/><text x="42" y="290" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10" fill="#6b5238" letter-spacing="2.2">BREWED BY ARYAN KHANNA · PUNE, INDIA</text><g transform="translate(830,284) rotate(-28)"><ellipse rx="5.0" ry="7" fill="url(#brass)"/><path d="M0 -5.6c3.1 3.5 -3.1 7.7 0 11.2" fill="none" stroke="#fff7e6" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(808,284) rotate(-14)"><ellipse rx="5.0" ry="7" fill="#9a6b1f" fill-opacity=".18"/><path d="M0 -5.6c3.1 3.5 -3.1 7.7 0 11.2" fill="none" stroke="#fff7e6" stroke-opacity=".7" stroke-width="1"/></g><g transform="translate(786,284) rotate(0)"><ellipse rx="5.0" ry="7" fill="#9a6b1f" fill-opacity=".18"/><path d="M0 -5.6c3.1 3.5 -3.1 7.7 0 11.2" fill="none" stroke="#fff7e6" stroke-opacity=".7" stroke-width="1"/></g></svg>